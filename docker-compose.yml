version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/recipe-platform
      JWT_SECRET: ${JWT_SECRET:?set a JWT_SECRET in a .env file next to this compose file}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
    volumes:
      - uploads-data:/app/uploads
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  mongo-data:
  uploads-data:
